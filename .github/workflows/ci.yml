name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Браузерные проверки — системный Google Chrome раннера (playwright-core, channel: 'chrome').
      - run: npm run test:browser
      - run: npm run test:package
      # Внешние потребители: архив в чистых проектах с Vite и React 18/19 (нужна сеть npm).
      - run: npm run test:consumers
      # PL12: архив из коммита (git archive → npm pack) и его запись — SHA-256, integrity, содержимое; на теге — ещё
      # согласованность номера. Публикация (scripts/release.mjs publish) сверяет свой архив с этой записью по содержимому.
      - name: Запись архива
        run: node scripts/release.mjs record --out release ${{ github.ref_type == 'tag' && format('--expect-tag {0}', github.ref_name) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-record
          path: release/
          if-no-files-found: error
